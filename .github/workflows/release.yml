name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version (X.Y.Z or X.Y.Z-beta.N)
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  BUILD_NUMBER: ${{ github.run_number }}
  RELEASES_DIR: ${{ github.workspace }}/.task/release-assets

jobs:
  validate:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    environment: release
    outputs:
      version: ${{ steps.contract.outputs.version }}
      tag: ${{ steps.contract.outputs.tag }}
      channel: ${{ steps.contract.outputs.channel }}
      commit: ${{ steps.contract.outputs.commit }}
      built_at: ${{ steps.contract.outputs.built_at }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve release contract
        id: contract
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Manual releases must run from main."
              exit 1
            fi
            candidate="$MANUAL_VERSION"
          else
            case "$GITHUB_REF" in
              refs/tags/v*) candidate="${GITHUB_REF_NAME#v}" ;;
              *) echo "::error::Tag releases require a v<version> tag."; exit 1 ;;
            esac
          fi

          version="$(go run ./scripts/releasetool contract --version "$candidate" --field version)"
          tag="$(go run ./scripts/releasetool contract --version "$candidate" --field tag)"
          channel="$(go run ./scripts/releasetool contract --version "$candidate" --field channel)"
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" && "$tag" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::The Git tag does not match the release contract."
            exit 1
          fi
          commit="$(git rev-parse 'HEAD^{commit}')"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release source did not resolve to a full Git commit."
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'channel=%s\n' "$channel" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'built_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.contract.outputs.commit }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main; then
            echo "::error::The release tag must point to a commit on main."
            exit 1
          fi
          checked_commit="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --commit "$RELEASE_COMMIT" \
              --event push \
              --status success \
              --limit 1 \
              --json headSha \
              --jq '.[0].headSha // ""'
          )"
          if [[ "$checked_commit" != "$RELEASE_COMMIT" ]]; then
            echo "::error::The release commit does not have a successful CI run for this exact SHA."
            exit 1
          fi

      - name: Reject a conflicting release tag
        shell: bash
        env:
          RELEASE_COMMIT: ${{ steps.contract.outputs.commit }}
          TAG: ${{ steps.contract.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            exit 0
          fi
          tag_commit="$(git rev-parse --verify -q "refs/tags/$TAG^{commit}" || true)"
          if [[ -n "$tag_commit" && "$tag_commit" != "$RELEASE_COMMIT" ]]; then
            echo "::error::The release tag already points to another commit."
            exit 1
          fi

      - name: Reject an existing Draft or Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.contract.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A Draft or Release already exists for $TAG."
            exit 1
          fi

      - name: Verify release secrets
        shell: bash
        env:
          PROFILEDECK_UPDATE_SIGNING_KEY_P8_BASE64: ${{ secrets.PROFILEDECK_UPDATE_SIGNING_KEY_P8_BASE64 }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            PROFILEDECK_UPDATE_SIGNING_KEY_P8_BASE64 \
            APPLE_DEVELOPER_ID_P12_BASE64 \
            APPLE_DEVELOPER_ID_P12_PASSWORD \
            APPLE_NOTARY_KEY_P8_BASE64 \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID
          do
            if [[ -z "${!name-}" ]]; then
              echo "::error::Required Actions secret $name is not configured."
              missing=1
            fi
          done
          exit "$missing"

  build-macos:
    needs: validate
    runs-on: ${{ vars.MACOS_RUNS_ON || 'macos-26' }}
    environment: release
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      BUILT_AT: ${{ needs.validate.outputs.built_at }}
      NOTARY_PROFILE: apple-notary
      RELEASE_KEYCHAIN_NAME: profiledeck-release.keychain-db
      ORIGINAL_KEYCHAINS_NAME: profiledeck-original-keychains.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Import Apple signing credentials
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          keychain_password="$(uuidgen)"
          echo "::add-mask::$keychain_password"
          release_keychain="$RUNNER_TEMP/$RELEASE_KEYCHAIN_NAME"
          original_keychains_file="$RUNNER_TEMP/$ORIGINAL_KEYCHAINS_NAME"
          security list-keychains -d user > "$original_keychains_file"
          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          security create-keychain -p "$keychain_password" "$release_keychain"
          security set-keychain-settings -lut 21600 "$release_keychain"
          security unlock-keychain -p "$keychain_password" "$release_keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$release_keychain" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$release_keychain"
          original_keychains=()
          while IFS= read -r line; do
            keychain="${line#"${line%%[![:space:]]*}"}"
            keychain="${keychain#\"}"
            keychain="${keychain%\"}"
            [[ -z "$keychain" ]] || original_keychains+=("$keychain")
          done < "$original_keychains_file"
          security list-keychains -d user -s "${original_keychains[@]}" "$release_keychain"
          sign_identity="$(scripts/release/resolve-signing-identity.sh --output name --keychain "$release_keychain")"
          echo "::add-mask::$sign_identity"
          printf 'PROFILEDECK_RELEASE_SIGN_IDENTITY=%s\n' "$sign_identity" >> "$GITHUB_ENV"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$RUNNER_TEMP/notary-key.p8" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --keychain "$release_keychain" \
            --validate
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8"

      - name: Build, sign, and notarize
        run: |
          make ci-release-build-macos \
            VERSION="$VERSION" \
            BUILD_NUMBER="$BUILD_NUMBER" \
            RELEASE_COMMIT="$RELEASE_COMMIT" \
            BUILT_AT="$BUILT_AT" \
            RELEASE_KEYCHAIN="$RUNNER_TEMP/$RELEASE_KEYCHAIN_NAME"

      - name: Upload macOS assets
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: .task/release-assets
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove Apple credentials
        if: ${{ always() }}
        shell: bash
        run: |
          cleanup_status=0
          release_keychain="$RUNNER_TEMP/$RELEASE_KEYCHAIN_NAME"
          original_keychains_file="$RUNNER_TEMP/$ORIGINAL_KEYCHAINS_NAME"
          if [[ -f "$original_keychains_file" ]]; then
            original_keychains=()
            while IFS= read -r line; do
              keychain="${line#"${line%%[![:space:]]*}"}"
              keychain="${keychain#\"}"
              keychain="${keychain%\"}"
              [[ -z "$keychain" ]] || original_keychains+=("$keychain")
            done < "$original_keychains_file"
            if [[ "${#original_keychains[@]}" -eq 0 ]]; then
              echo "::error::The original Keychain search list could not be restored."
              cleanup_status=1
            elif ! security list-keychains -d user -s "${original_keychains[@]}"; then
              echo "::error::Could not restore the original Keychain search list."
              cleanup_status=1
            fi
          else
            echo "::error::The original Keychain search list was not recorded."
            cleanup_status=1
          fi
          if [[ -f "$release_keychain" ]] && ! security delete-keychain "$release_keychain"; then
            echo "::error::Could not delete the temporary release Keychain."
            cleanup_status=1
          fi
          if ! rm -f \
            "$original_keychains_file" \
            "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP/notary-key.p8"; then
            echo "::error::Could not remove temporary Apple credential files."
            cleanup_status=1
          fi
          exit "$cleanup_status"

  build-linux:
    needs: validate
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-24.04' }}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      BUILT_AT: ${{ needs.validate.outputs.built_at }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Desktop and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y file libgtk-4-dev libwebkitgtk-6.0-dev rpm

      - name: Build Linux assets
        run: |
          make ci-release-build-linux-amd64 \
            VERSION="$VERSION" RELEASE_COMMIT="$RELEASE_COMMIT" BUILT_AT="$BUILT_AT"

      - name: Verify portable updater
        run: make ci-verify-update-e2e

      - name: Smoke-test DEB and RPM
        run: make release-linux-smoke VERSION="$VERSION"

      - name: Upload Linux assets
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-amd64
          path: .task/release-assets
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  draft:
    needs:
      - validate
      - build-macos
      - build-linux
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: ${{ needs.validate.outputs.tag }}
      CHANNEL: ${{ needs.validate.outputs.channel }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download platform assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: .task/release-assets
          merge-multiple: true

      - name: Load updater signing key
        env:
          PROFILEDECK_UPDATE_SIGNING_KEY_P8_BASE64: ${{ secrets.PROFILEDECK_UPDATE_SIGNING_KEY_P8_BASE64 }}
        run: |
          umask 077
          printf '%s' "$PROFILEDECK_UPDATE_SIGNING_KEY_P8_BASE64" |
            base64 --decode > "$RUNNER_TEMP/profiledeck-update-signing-key.p8"

      - name: Finalize and verify release assets
        run: |
          make ci-release-finalize \
            VERSION="$VERSION" \
            UPDATE_SIGNING_KEY="$RUNNER_TEMP/profiledeck-update-signing-key.p8"

      - name: Reject an existing Draft or Release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A Draft or Release already exists for $TAG."
            exit 1
          fi

      - name: Create exact manual release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          git push origin "${RELEASE_COMMIT}:refs/tags/$TAG"
          remote_tag="$(
            git ls-remote --refs --tags origin "refs/tags/$TAG" |
              awk 'NR == 1 { print $1 }'
          )"
          if [[ "$remote_tag" != "$RELEASE_COMMIT" ]]; then
            echo "::error::The manual release tag does not point to the validated commit."
            exit 1
          fi

      - name: Create Draft Release
        shell: bash
        run: |
          set -euo pipefail
          args=(release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag
            --generate-notes --title "ProfileDeck $VERSION")
          if [[ "$CHANNEL" == "beta" ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh "${args[@]}" "$RELEASES_DIR"/*

      - name: Remove updater signing key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/profiledeck-update-signing-key.p8"
