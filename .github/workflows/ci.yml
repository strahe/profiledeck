name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full quality gate on Linux (lint, tests, build, security).
  test-linux:
    name: Test (linux)
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            desktop/frontend/package-lock.json
            docs/package-lock.json

      - name: Install GTK and WebKit for Desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Lint, test, and build CLI
        run: make ci-core-check

      - name: Lint, test, and build Desktop
        run: make ci-desktop-check

      - name: Security scan
        run: make ci-security-check

  # Platform smoke only (not a second full quality suite).
  test-macos:
    name: Test (macos)
    if: ${{ vars.DISABLE_MACOS_CI != 'true' }}
    runs-on: ${{ vars.MACOS_RUNS_ON || 'macos-26' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Test Go packages
        run: go test ./cmd/... ./internal/...

      - name: Install frontend dependencies
        run: npm --prefix desktop/frontend ci

      - name: Build frontend
        run: npm --prefix desktop/frontend run build

      - name: Build Desktop
        run: go build -tags production -o profiledeck-desktop ./desktop

  test-windows:
    name: Test (windows)
    if: ${{ vars.DISABLE_WINDOWS_CI != 'true' }}
    runs-on: ${{ vars.WINDOWS_RUNS_ON || 'windows-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Test Go packages
        run: go test ./cmd/... ./internal/...

      - name: Install frontend dependencies
        run: npm --prefix desktop/frontend ci

      - name: Build frontend
        run: npm --prefix desktop/frontend run build

      - name: Build Desktop
        run: go build -tags production -o profiledeck-desktop.exe ./desktop
